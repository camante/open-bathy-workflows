[pytest]
testpaths = tests
addopts = -v --tb=short --no-header
log_cli = true
log_cli_level = WARNING
markers =
    smoke: Fast checks (compile, imports, contracts) — run before every delivery
    regression: Core numerical/behavioral tests — run before merge
    heavy: End-to-end validation, seam tests — run before release
    core: Current authoritative-first, support-aware, guidance-conditioned workflow tests
    transitional: Migration-safety tests for routes and behaviors still being demoted or replaced
    legacy: Compatibility tests for older fusion-centered behavior kept for regression coverage
